<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Auth System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card dashboard-card">

            <h1>Welcome to Your Dashboard!</h1>
            <p class="subtitle">You have successfully logged in.</p>


            <div class="dashboard-content">
                <p>Welcome, <strong id="user-name">User</strong>!</p>

                <p>
                    This is your personal dashboard.
                    You can access it after logging in.
                </p>
            </div>

            <button type="button" id="logout-button" class="primary-button">
                Logout
            </button>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
